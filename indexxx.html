<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div id="display">
        </div>

        <script>
            let get = document.getElementById(`display`)

            for (let i = 1; i <= 150; i++) {
            
            if (i % 5 == 0 && i % 3 == 0) {
                get.innerHTML += `<p style ="color:blue;">${i} fizzbuzz</p>`
            }
            else if (i % 3 == 0) {
                get.innerHTML += `<p style ="color:green;">${i} fizz</p>`
            }
            else if (i % 5 == 0) {
                get.innerHTML += `<p style ="color:red;">${i} buzz</p>`
            }           
            else {
                    get.innerHTML += `<p style ="color:orange;">${i} neither fizz nor buzz</p>`
                }
            }
        </script>
</body>

</html>
