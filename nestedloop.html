<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="checkOut()">close</button>
    
    <script>
        for(let i = 1; i<=5; i++){
            for(let j = 1; j<=30; j++){
                console.log(`${i} x ${j} = ${i * j}`);
                
            }
        }
        function checkOut(){
            window.close()
        }
    </script>
</body>
